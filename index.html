<!-- VERSION: v3.0.5 (State Retention via LocalStorage) -->
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>シャンチー v3.0.5 Mobile-Pro</title>
    <style>
        /* ★書き換え：ボタンを圧迫しないように横幅を制限したスタイル */
        .combo-popup {
            font-size: 22px; /* 少しだけ基本サイズをシャープに */
            font-weight: 900;
            font-family: 'Impact', sans-serif;
            color: #f1c40f;
            text-shadow: 0 0 6px rgba(0,0,0,0.8), 0 0 15px #f39c12;
            pointer-events: none;
            white-space: nowrap;
            opacity: 0;
            transition: opacity 0.1s ease;
            
            /* ★追加：ボタンを絶対に圧迫しないための防壁 */
            max-width: calc(100% - 220px); /* ボタン5個分の幅を確実に確保して残りを最大幅にする */
            overflow: hidden;
            text-overflow: ellipsis; /* 万が一溢れてもボタンを潰さず、文字の末尾を「...」にする */
        }
        .combo-popup.critical {
            color: #ff3838;
            text-shadow: 0 0 6px rgba(0,0,0,0.8), 0 0 20px #ff0000;
        }
        .combo-popup.show {
            opacity: 1;
        }
        /* ★追加：将を撃破できる瞬間の妖しい紫色の輝き */
        .combo-popup.awake-style {
            color: #bf5af2 !important;
            text-shadow: 0 0 6px rgba(0,0,0,0.8), 0 0 20px #bf5af2 !important;
        }

        :root {
            --board-bg: #f5deb3;
            --river-bg: rgba(100, 180, 255, 0.25);
            --line-color: #5d4037;
            --blue-piece: radial-gradient(circle at 30% 30%, #4a90e2, #1a5a9e);
            --red-piece: radial-gradient(circle at 30% 30%, #e74c3c, #96281b);
        }
        
        /* テキスト選択とシステムメニューを完全に禁止 */
        * { 
            -webkit-user-select: none;  
            user-select: none; 
            -webkit-touch-callout: none; 
            -webkit-tap-highlight-color: transparent;
        }

        html, body { position: fixed; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start; 
            background-color: #2c3e50; margin: 0; padding: 15px 10px 10px 10px; 
            font-family: sans-serif; touch-action: none; color: white; 
        }
        
        /* 凡例 */
        #legend { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; 
            margin-top: 8px; padding: 6px; background: rgba(0,0,0,0.4); 
            border-radius: 6px; width: 95vw; max-width: 380px; font-size: 13px; 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .leg-item { display: flex; align-items: center; gap: 4px; color: #eee; }
        .leg-dot { width: 14px; height: 14px; border-radius: 50%; box-sizing: border-box; }
        .leg-sq { width: 14px; height: 14px; border: 1.5px solid rgba(160,160,160,1); border-radius: 3px; background: rgba(200,200,200,0.3); }

        /* 特殊演出 */
        .thunder-line { position: absolute; background: white; box-shadow: 0 0 30px 10px #bf5af2, 0 0 60px 20px white; z-index: 2500; pointer-events: none; opacity: 0; }
        .thunder-h { height: 8px; width: 100%; left: 0; animation: bolt-flash-multi 0.5s ease-out; }
        .thunder-v { width: 8px; height: 100%; top: 0; animation: bolt-flash-multi 0.5s ease-out; }
        @keyframes bolt-flash-multi { 0%, 20%, 40%, 60% { opacity: 0; transform: scale(1.5); } 10%, 30%, 50% { opacity: 1; transform: scale(1); filter: brightness(3); } 100% { opacity: 0; transform: scale(0.5); } }
        #whiteout { position: fixed; top:0; left:0; width:100%; height:100%; background:white; opacity:0; pointer-events:none; z-index:2400; }
        .whiteout-active { animation: whiteout-ani 0.5s ease-out; }

        .zap-particle { position: absolute; width: 3px; height: 12px; background: #fff; box-shadow: 0 0 12px #bf5af2, 0 0 6px #fff; border-radius: 2px; pointer-events: none; z-index: 2000; animation: zap-ani 0.25s ease-out forwards; }
        @keyframes zap-ani { 0% { transform: translate(-50%, -50%) rotate(var(--rot)) scaleY(0); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scaleY(1.5); opacity: 0; } }
        .blast { position: absolute; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 3000; animation: blast-ani 0.5s ease-out forwards; border: 5px solid white; }
        .blast.gold { border-color: #f1c40f; box-shadow: 0 0 20px #f1c40f; }
        .blast.purple { border-color: #9b59b6; box-shadow: 0 0 30px #bf5af2; }
        .blast.red { border-color: #ff0000; box-shadow: 0 0 40px #f00; }
        @keyframes blast-ani { 0% { width: 0; height: 0; opacity: 1; border-width: 15px; } 100% { width: 350px; height: 350px; opacity: 0; border-width: 1px; } }

        @keyframes shake-anim { 0% { transform: translate(0, 0); } 25% { transform: translate(-6px, 6px); } 50% { transform: translate(6px, -6px); } 75% { transform: translate(-6px, -6px); } 100% { transform: translate(0, 0); } }
        .shaking { animation: shake-anim 0.08s infinite; }
        #warning-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 0, 0, 0.4); display: none; align-items: center; justify-content: center; z-index: 4000; pointer-events: none; }
        .warning-text { font-size: 55px; color: #ff0000; text-shadow: 0 0 20px black, 0 0 10px white; animation: blink-fast 0.15s infinite; font-weight: 900; width: 80%; text-align: center; }

        #game-container { width: 90vw; max-width: 360px; aspect-ratio: 360 / 400; position: relative; background-color: var(--board-bg); border: 4px double var(--line-color); box-shadow: 0 10px 30px rgba(0,0,0,0.6); box-sizing: border-box; touch-action: none; }
        #board-grid { position: absolute; top: 5%; left: 5%; right: 5%; bottom: 5%; background-image: linear-gradient(var(--line-color) 1px, transparent 1px), linear-gradient(90deg, var(--line-color) 1px, transparent 1px); background-size: 100% 12.5%, 14.2857% 100%; border-right: 1px solid var(--line-color); border-bottom: 1px solid var(--line-color); pointer-events: none; -webkit-mask-image: linear-gradient(to bottom, black 37.5%, transparent 37.5%, transparent 50%, black 50%); mask-image: linear-gradient(to bottom, black 37.5%, transparent 37.5%, transparent 50%, black 50%); }
        #river { position: absolute; top: 38.75%; left: 5%; right: 5%; height: 11.25%; background-color: var(--river-bg); pointer-events: none; border-top: 1px solid var(--line-color); border-bottom: 1px solid var(--line-color); }
        .point { position: absolute; width: 6px; height: 6px; background-color: var(--line-color); border-radius: 50%; transform: translate(-50%, -50%); opacity: 0.4; z-index: 2; }
        
        .piece-ui { width: 34px; height: 34px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #fff; font-weight: 600; font-size: 18px; text-shadow: 1px 1px 2px #000; box-shadow: 0 3px 6px rgba(0,0,0,0.4); border: 1.5px solid rgba(220, 220, 220, 0.8); box-sizing: border-box; touch-action: none; }
        .piece-ui.blue { background: var(--blue-piece); }
        .piece-ui.red { background: var(--red-piece); }
        .piece { position: absolute; transform: translate(-50%, -50%); cursor: grab; z-index: 30; transition: left 0.1s, top 0.1s; }
        .enemy-striking { transition: left 1.0s cubic-bezier(0.45, 0.05, 0.55, 0.95), top 1.0s cubic-bezier(0.45, 0.05, 0.55, 0.95) !important; z-index: 5000 !important; }

        .awake-active { background: radial-gradient(circle at 30% 30%, #9b59b6, #6c3483) !important; animation: glow-purple 0.3s infinite alternate; box-shadow: 0 0 25px #bf5af2; border: 2.5px solid white !important; z-index: 41 !important; }
        .taiko-active { background: radial-gradient(circle at 30% 30%, #f1c40f, #f39c12) !important; animation: glow-gold 0.5s infinite alternate; box-shadow: 0 0 20px #f1c40f; border: 2.5px solid white !important; z-index: 40 !important; }

        .marker { border-radius: 50%; position: absolute; transform: translate(-50%, -50%); pointer-events: none; z-index: 20; box-sizing: border-box; }
        .marker.safe { width: 22px; height: 22px; background: rgba(255, 235, 59, 0.9); border: 2px solid #fff; box-shadow: 0 0 4px rgba(0,0,0,0.3); }
        .marker.best { width: 40px; height: 40px; border: 3px solid #4caf50; background: rgba(76, 175, 80, 0.4); }
        .marker.aim { width: 38px; height: 38px; border: 3px dotted #4caf50; background: rgba(76, 175, 80, 0.1); }
        .marker.danger { width: 42px; height: 42px; background: rgba(255, 0, 0, 0.2); border: 3px solid #ff0000; }
        .marker.guide { width: 24px; height: 24px; border-radius: 3px; border: 1.5px solid rgba(160, 160, 160, 0.8); background: rgba(200, 200, 200, 0.2); }

        #top-controls { width: 90vw; max-width: 360px; display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 5px; margin-top: 2px; }
        .ctrl-btn { font-size: 18px; width: 42px; height: 42px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); color: white; background: #555; transition: all 0.2s; touch-action: manipulation; flex-shrink: 0; }
        #awake-btn.active { background: #9b59b6; box-shadow: 0 0 15px #9b59b6; }
        #taiko-btn.active { background: #f1c40f; box-shadow: 0 0 15px #f1c40f; }
        #palette { margin-top: 8px; display: flex; gap: 6px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 10px; flex-wrap: wrap; justify-content: center; width: 90vw; max-width: 360px; box-sizing: border-box; }
        #drum-cutin { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 160px; pointer-events: none; z-index: 6000; display: none; }
        .drum-show { display: block !important; animation: drum-show-ani 1s forwards; }
    </style>
</head>
<body>
<!-- (後半に続く...) -->
<div id="whiteout"></div>
<div id="warning-overlay"><div class="warning-text">WARNING</div></div>
<div id="drum-cutin">🥁</div>

<!-- ★書き換え：top-controlsの中に、 predict-box を追加 -->
<div id="top-controls">
    <!-- 🔥ボタンの左隣にスコア表示枠を滑り込ませる -->
    <div id="predict-box" class="combo-popup" style="margin-right: auto; padding-left: 5px; align-self: center;"></div>
    
    <div id="awake-btn" class="ctrl-btn">🔥</div>
    <div id="taiko-btn" class="ctrl-btn">🥁</div>
    <div id="undo-btn" class="ctrl-btn" style="background:#3498db">⟲</div>
    <div id="redo-btn" class="ctrl-btn" style="background:#3498db">⟳</div>
    <div id="trash-can" class="ctrl-btn" style="background:#e74c3c">🗑️</div>
</div>


<div id="game-container"><div id="board-grid"></div><div id="river"></div></div>

<div id="palette">
    <div class="palette-item piece-ui blue" data-side="blue" data-type="車">車</div>
    <div class="palette-item piece-ui red" data-side="red" data-type="卒">卒</div>
    <div class="palette-item piece-ui red" data-side="red" data-type="士">士</div>
    <div class="palette-item piece-ui red" data-side="red" data-type="馬">馬</div>
    <div class="palette-item piece-ui red" data-side="red" data-type="象">象</div>
    <div class="palette-item piece-ui red" data-side="red" data-type="砲">砲</div>
    <div class="palette-item piece-ui red" data-side="red" data-type="車">車</div>
    <div class="palette-item piece-ui red" data-side="red" data-type="将">将</div>
</div>

<div id="legend">
    <div class="leg-item"><div class="leg-dot" style="border:3px solid #4caf50; background:rgba(76,175,80,0.4)"></div>撃破</div>
    <div class="leg-item"><div class="leg-dot" style="border:3px dotted #4caf50; background:rgba(76,175,80,0.1)"></div>候補</div>
    <div class="leg-item"><div class="leg-dot" style="border:2px solid #fff; background:rgba(255,235,59,0.9)"></div>可</div>
    <div class="leg-item"><div class="leg-dot" style="border:3px solid #ff0000; background:rgba(255,0,0,0.2)"></div>不可</div>
    <div class="leg-item"><div class="leg-sq"></div>敵ガイド</div>
</div>

<!-- ★追加：凡例（#legend）のすぐ下に配置 -->
<div id="trash-guide" style="margin-top: 10px; display: grid; grid-template-columns: auto 1fr; gap: 0 4px; justify-content: center; font-size: 11px; color: #b0bec5; width: 95vw; max-width: 380px; line-height: 1.6; letter-spacing: 0.5px; opacity: 0.85; margin-left: auto; margin-right: auto;">
    <div style="text-align: right;">🗑️ボタン：</div>
    <div style="text-align: left;">タップで【盤面のみクリア】</div>
    <div></div> <!-- 左列の空欄（2行目） -->
    <div style="text-align: left;">長押しで【完全クリア（履歴含)】</div>
</div>


<script>
    const container = document.getElementById('game-container'), warningOverlay = document.getElementById('warning-overlay'), drumCutin = document.getElementById('drum-cutin'), trashBtn = document.getElementById('trash-can'), whiteout = document.getElementById('whiteout');
    const COLS = 8, ROWS = 9;
    const DIRS_4 = [[0,-1], [0,1], [-1,0], [1,0]]; 
    const DIRS_HORSE = [[1,-2], [-1,-2], [1,2], [-1,2], [2,-1], [-2,-1], [2,1], [-2,1]];
    const DIRS_ELEPH = [[-2,-2], [2,-2], [-2,2], [2,2]];
    const DIRS_DIAG = [[-1,-1], [1,-1], [-1,1], [1,1]];

    let pieces = [], history = [{p:[], t:false, a:false}], hIdx = 0, isTaiko = false, isAwake = false, isAnimating = false, draggedPieceId = null;

    function init() {
        for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
            const dot = document.createElement('div'); dot.className = 'point';
            dot.style.left = (5 + (x / 7) * 90) + '%'; dot.style.top = (5 + (y / 8) * 90) + '%';
            container.appendChild(dot);
        }
        setupEvents();

        // ★追加：ローカルストレージから前回の状態を復元
        const savedState = localStorage.getItem('xiangqi_sim_state');
        if (savedState) {
            try {
                const state = JSON.parse(savedState);
                history = state.history || [{p:[], t:false, a:false}];
                hIdx = state.hIdx !== undefined ? state.hIdx : history.length - 1;
                
                const current = history[hIdx];
                pieces = JSON.parse(JSON.stringify(current.p));
                isTaiko = current.t;
                isAwake = current.a;
            } catch (e) {
                console.error("セーブデータの復元に失敗:", e);
                localStorage.removeItem('xiangqi_sim_state');
            }
        }

        render();
        updateUI(); // 画面ボタンの状態を同期
        setInterval(animatePlasma, 80);
    }

    function animatePlasma() {
        if (!isAwake || isAnimating) return;
        const blue = pieces.find(p => p.side === 'blue');
        if (blue) createZap((5 + (blue.x / 7) * 90) + '%', (5 + (blue.y / 8) * 90) + '%', true);
    }

    function createZap(l, t, isB) {
        const p = document.createElement('div'); p.className = 'zap-particle';
        if (isB) { p.style.left = l; p.style.top = t; } else { p.style.left = l + 'px'; p.style.top = t + 'px'; p.style.position = 'fixed'; }
        const r = Math.random() * 360, d = 15 + Math.random() * 20, a = Math.random() * Math.PI * 2;
        p.style.setProperty('--rot', r + 'deg'); p.style.setProperty('--dx', Math.cos(a) * d + 'px'); p.style.setProperty('--dy', Math.sin(a) * d + 'px');
        (isB ? container : document.body).appendChild(p); setTimeout(() => p.remove(), 250);
    }

    function triggerThunderbolt(x, y) {
        whiteout.classList.add('whiteout-active');
        const h = document.createElement('div'); h.className = 'thunder-line thunder-h'; h.style.top = (5 + (y / 8) * 90) + '%';
        const v = document.createElement('div'); v.className = 'thunder-line thunder-v'; v.style.left = (5 + (x / 7) * 90) + '%';
        container.appendChild(h); container.appendChild(v);
        document.body.classList.add('shaking');
        setTimeout(() => { h.remove(); v.remove(); document.body.classList.remove('shaking'); whiteout.classList.remove('whiteout-active'); }, 500);
    }

    function triggerBlast(x, y, c) {
        const b = document.createElement('div'); b.className = 'blast ' + c;
        b.style.left = (5 + (x / 7) * 90) + '%'; b.style.top = (5 + (y / 8) * 90) + '%';
        container.appendChild(b); setTimeout(() => b.remove(), 600);
    }

    function updateUI() { 
        document.getElementById('taiko-btn').classList.toggle('active', isTaiko); 
        document.getElementById('awake-btn').classList.toggle('active', isAwake); 
    }
    function saveH() { 
        history = history.slice(0, hIdx + 1); 
        history.push({ p: JSON.parse(JSON.stringify(pieces)), t: isTaiko, a: isAwake }); 
        hIdx++; updateUI();

        // ★追加：履歴とインデックスを丸ごとセーブ
        localStorage.setItem('xiangqi_sim_state', JSON.stringify({ history, hIdx }));
    }

    function applyH() { 
        const s = history[hIdx]; pieces = JSON.parse(JSON.stringify(s.p)); isTaiko = s.t; isAwake = s.a; 
        render(); updateUI();

        // ★追加：戻した（進めた）状態をセーブ
        localStorage.setItem('xiangqi_sim_state', JSON.stringify({ history, hIdx }));
    }


    function setupEvents() {
        document.querySelectorAll('.palette-item').forEach(el => el.onpointerdown = (e) => !isAnimating && handleStart(e, el.dataset.side, el.dataset.type));
        // ★書き換え：setupEvents内のtrashBtnに関連する処理を以下に丸ごと差し替え
        let trashTimer = null;
        let isLongPress = false;

        // タッチが始まったとき（指を置いたとき）
        trashBtn.onpointerdown = (e) => {
            if (isAnimating) return;
            isLongPress = false;
            
            // 1秒（1000ミリ秒）後に長押し判定を実行
            trashTimer = setTimeout(() => {
                isLongPress = true;
                // 視覚的に長押しが成功したことを伝えるため、ボタンの色を一時的に白くフラッシュさせる
                trashBtn.style.background = "#fff";
                trashBtn.style.color = "#000";
                
                if (confirm("【完全リセット】\nこれまでの履歴もセーブデータもすべて完全に消去しますか？")) {
                    pieces = []; isTaiko = false; isAwake = false;
                    history = [{p:[], t:false, a:false}];
                    hIdx = 0;
                    localStorage.removeItem('xiangqi_sim_state'); // ストレージも完全削除
                    updateUI(); render();
                    alert("すべてのデータを完全初期化しました。");
                }
                // ボタンの色を元に戻す
                trashBtn.style.background = "#e74c3c";
                trashBtn.style.color = "#fff";
            }, 1000);
        };

        // 指が離れたとき（タップ・または長押し終了）
        trashBtn.onpointerup = () => {
            clearTimeout(trashTimer);
            // 長押しにならなかった場合（普通の短いタップの場合）は盤面クリアを実行
            if (!isLongPress && !isAnimating) {
                if (confirm("盤面をクリアしますか？\n（「一手戻る ⟲」で元の配置に戻せます）")) {
                    pieces = []; isTaiko = false; isAwake = false;
                    saveH(); // 空の盤面を履歴の新しい1手として保存
                    render();
                }
            }
        };

        // 指がボタンの外に流れていって離れたときの保険
        trashBtn.onpointercancel = trashBtn.onpointerleave = () => {
            clearTimeout(trashTimer);
        };


        document.getElementById('undo-btn').onclick = () => !isAnimating && hIdx > 0 && (hIdx--, applyH());
        document.getElementById('redo-btn').onclick = () => !isAnimating && hIdx < history.length - 1 && (hIdx++, applyH());
        document.getElementById('taiko-btn').onclick = () => { if (!isAnimating) { isTaiko = !isTaiko; if (isTaiko) { drumCutin.classList.add('drum-show'); setTimeout(() => drumCutin.classList.remove('drum-show'), 1000); } saveH(); render(); } };
        document.getElementById('awake-btn').onclick = () => { if (!isAnimating) { isAwake = !isAwake; saveH(); render(); } };
        window.onpointermove = (e) => !isAnimating && handleMove(e);
        window.onpointerup = (e) => !isAnimating && handleEnd(e);
    }

    function handleStart(e, s, t, id = null) {
        e.preventDefault(); draggedPieceId = id; const pD = pieces.find(p => p.id === id);
        window.activeDrag = { side: s, type: t, id, startX: pD ? pD.x : -1, startY: pD ? pD.y : -1, element: createGhost(t, s, e.clientX, e.clientY) };
        render(); if (s === 'red' && id !== null) showEnemyGuide(pD);
    }

    function createGhost(t, s, x, y) {
        const g = document.createElement('div'); g.className = `piece-ui ${s}`;
        if (s === 'blue') { if (isAwake) g.classList.add('awake-active'); else if (isTaiko) g.classList.add('taiko-active'); }
        g.innerText = t; g.style.position = 'fixed'; g.style.left = x + 'px'; g.style.top = y + 'px'; g.style.transform = 'translate(-50%, -50%) scale(1.2)'; g.style.zIndex = '1000'; g.style.pointerEvents = 'none';
        document.body.appendChild(g); return g;
    }

    // グローバルに変数を1つ追加（スクリプトの一番上などの適当な場所に置いてください）
    let lastHoveredKey = "";

    function handleMove(e) { 
        if (!window.activeDrag) return; 
        window.activeDrag.element.style.left = e.clientX + 'px'; 
        window.activeDrag.element.style.top = e.clientY + 'px'; 
        if (isAwake && window.activeDrag.side === 'blue') createZap(e.clientX, e.clientY, false); 

        // ドラッグ中の指の下にあるマスを計算
        const rect = container.getBoundingClientRect();
        const x = Math.round((((e.clientX - rect.left) / rect.width) - 0.05) / 0.9 * 7);
        const y = Math.round((((e.clientY - rect.top) / rect.height) - 0.05) / 0.9 * 8);
        const currentKey = x + "," + y;

        if (currentKey !== lastHoveredKey) {
            lastHoveredKey = currentKey;
            
            const markers = Array.from(document.querySelectorAll('.marker'));
            const targetMarker = markers.find(m => m.dataset.gx == x && m.dataset.gy == y);
            const pBox = document.getElementById('predict-box');
            
            if (targetMarker && targetMarker.dataset.pts && parseInt(targetMarker.dataset.pts) > 0) {
                const pts = parseInt(targetMarker.dataset.pts);
                
                // この移動で「将」を撃破して次手で覚醒モードになるかチェック
                let willAwake = false;
                
                // 1) 太鼓モード時の経路上の将チェック
                if (isTaiko) {
                    const dx = Math.sign(x - window.activeDrag.startX), dy = Math.sign(y - window.activeDrag.startY);
                    if (dx !== 0 || dy !== 0) {
                        let tx = window.activeDrag.startX, ty = window.activeDrag.startY;
                        while (tx !== x || ty !== y) {
                            tx += dx; ty += dy;
                            const p = pieces.find(p => p.x === tx && p.y === ty && p.side === 'red');
                            if (p && p.type === '将') { willAwake = true; break; }
                        }
                    }
                // 2) 覚醒モード時の十字雷撃範囲の将チェック
                } else if (isAwake) {
                    const targets = pieces.filter(p => p.side === 'red' && (p.x === x || p.y === y));
                    if (targets.some(p => p.type === '将')) willAwake = true;
                // 3) 通常移動時の移動先の将チェック
                } else {
                    const p = pieces.find(p => p.x === x && p.y === y && p.side === 'red');
                    if (p && p.type === '将') willAwake = true;
                }

                // ベースのスタイルクラスを付与
                pBox.className = 'combo-popup show';
                if (pts >= 50) pBox.classList.add('critical');
                
                // ★修正：将を倒せるマスなら紫色（覚醒カラー）に染める、それ以外は通常（黄色/赤）
                if (willAwake) {
                    pBox.classList.add('awake-style');
                }
                
                // 文字数を最短にするため、数字とPTSのみを表示
                pBox.innerText = `${pts} PTS`;
                
            } else {
                pBox.classList.remove('show');
            }
        }
    }




    function handleEnd(e) {
        if (!window.activeDrag) return;
        const rect = container.getBoundingClientRect(), tr = trashBtn.getBoundingClientRect(); window.activeDrag.element.remove();
        if (e.clientX >= tr.left && e.clientX <= tr.right && e.clientY >= tr.top && e.clientY <= tr.bottom) {
            if (window.activeDrag.id) { pieces = pieces.filter(p => p.id !== window.activeDrag.id); saveH(); }
        } else {
            const x = Math.round((((e.clientX - rect.left) / rect.width) - 0.05) / 0.9 * 7), y = Math.round((((e.clientY - rect.top) / rect.height) - 0.05) / 0.9 * 8);
            if (x >= 0 && x < COLS && y >= 0 && y < ROWS) {
                if (!(window.activeDrag.id && window.activeDrag.startX === x && window.activeDrag.startY === y)) {
                    if (window.activeDrag.side === 'blue') pieces = pieces.filter(p => p.side !== 'blue');
                    let killedGen = false;
                    if (window.activeDrag.side === 'blue' && window.activeDrag.id !== null) {
                        const dx = Math.sign(x - window.activeDrag.startX), dy = Math.sign(y - window.activeDrag.startY);
                        if (isTaiko && (dx !== 0 || dy !== 0)) {
                            let tx = window.activeDrag.startX, ty = window.activeDrag.startY;
                            while (tx !== x || ty !== y) {
                                tx += dx; ty += dy; const vIdx = pieces.findIndex(p => p.x === tx && p.y === ty && p.side === 'red');
                                if (vIdx !== -1) { if (pieces[vIdx].type === '将') killedGen = true; triggerBlast(tx, ty, pieces[vIdx].type === '将' ? 'purple' : 'gold'); pieces.splice(vIdx, 1); }
                            }
                        } else {
                            const t = pieces.find(p => p.x === x && p.y === y && p.side === 'red'); 
                            if (t) { if (t.type === '将') killedGen = true; triggerBlast(x, y, t.type === '将' ? 'purple' : 'gold'); }
                        }
                        // 【修正後】十字雷撃の巻き込みでも「将」を判定するコード
                        if (isAwake) { 
                            triggerThunderbolt(x, y); 
                            // 十字の範囲（同じ列、または同じ行）にいる敵を抽出
                            const targets = pieces.filter(p => p.side === 'red' && (p.x === x || p.y === y));
                            targets.forEach(p => {
                                // ★修正点：巻き込んだ敵の中に「将」がいたらフラグを立てる
                                if (p.type === '将') killedGen = true;
                                triggerBlast(p.x, p.y, p.type === '将' ? 'purple' : 'purple'); 
                            });
                            // 対象の敵を盤面から削除
                            pieces = pieces.filter(p => !(p.side === 'red' && (p.x === x || p.y === y))); 
                            isAwake = false; 
                        }
                    }
                    pieces = pieces.filter(p => !(p.x === x && p.y === y) && p.id !== window.activeDrag.id);
                    pieces.push({ id: window.activeDrag.id || Date.now(), side: window.activeDrag.side, type: window.activeDrag.type, x, y });
                    if (killedGen) isAwake = true; isTaiko = false; saveH();
                    if (window.activeDrag.id !== null && window.activeDrag.side === 'blue') checkDefeat(pieces.find(p => p.side === 'blue'));
                }
            }
        }
        window.activeDrag = null; draggedPieceId = null; render();
        lastHoveredKey = "";
        
        // ★関数の最後に追加：ドラッグ終了時に予測表示を完全に消去・リセット
        const pBox = document.getElementById('predict-box');
        if (pBox) pBox.classList.remove('show');
        window.activeDrag = null; 
        draggedPieceId = null; 
        lastHoveredKey = ""; // ホバー状態もリセット
        render();
    }

    function checkDefeat(blue) {
        if (!blue) return; const amap = getAttackMap(pieces, 'red');
        if (amap.has(blue.x + ',' + blue.y)) {
            isAnimating = true; warningOverlay.style.display = 'flex'; document.body.classList.add('shaking');
            setTimeout(() => {
                warningOverlay.style.display = 'none'; document.body.classList.remove('shaking');
                const enemy = pieces.find(e => e.side === 'red' && getAttackMap(pieces, 'red', e).has(blue.x + ',' + blue.y));
                if (enemy) {
                    const el = Array.from(document.querySelectorAll('.piece')).find(i => i.dataset.id == enemy.id);
                    if (el) { el.classList.add('enemy-striking'); el.style.left = (5 + (blue.x / 7) * 90) + '%'; el.style.top = (5 + (blue.y / 8) * 90) + '%'; enemy.x = blue.x; enemy.y = blue.y; }
                }
                setTimeout(() => { triggerBlast(blue.x, blue.y, 'red'); pieces = pieces.filter(p => p.side !== 'blue'); isAnimating = false; saveH(); render(); }, 1050);
            }, 600);
        }
    }

    function getAttackMap(pList, side = 'red', singlePiece = null) {
        const amap = new Set(); const targets = singlePiece ? [singlePiece] : pList.filter(p => p.side === side);
        targets.forEach(p => {
            const add = (nx, ny) => { if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) amap.add(nx + ',' + ny); };
            const check = (nx, ny) => pList.find(o => o.x === nx && o.y === ny);
            if (p.type === '車' || p.type === '将') DIRS_4.forEach(([dx, dy]) => { let tx=p.x, ty=p.y; for (let i = 1; i < 10; i++) { tx+=dx; ty+=dy; if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) break; add(tx, ty); if (check(tx, ty)) break; if(p.type==='将') break; } });
            if (p.type === '砲') DIRS_4.forEach(([dx, dy]) => { let tx=p.x, ty=p.y, c = 0; for (let i = 1; i < 10; i++) { tx+=dx; ty+=dy; if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) break; if (c === 0) { if (check(tx, ty)) c = 1; } else { add(tx, ty); if (check(tx, ty)) break; } } });
            if (p.type === '馬') DIRS_HORSE.forEach(([dx, dy]) => { let lx = p.x + (Math.abs(dx)===2 ? dx/2 : 0), ly = p.y + (Math.abs(dy)===2 ? dy/2 : 0); if (!check(lx, ly)) add(p.x + dx, p.y + dy); });
            if (p.type === '象') DIRS_ELEPH.forEach(([dx, dy]) => { if (!check(p.x + dx / 2, p.y + dy / 2)) add(p.x + dx, p.y + dy); });
            if (p.type === '士') DIRS_DIAG.forEach(([dx, dy]) => add(p.x + dx, p.y + dy));
            if (p.type === '卒') DIRS_4.forEach(([dx, dy]) => add(p.x + dx, p.y + dy));
        });
        return amap;
    }

    function showEnemyGuide(p) {
        const amap = new Set(); const check = (nx, ny) => pieces.find(o => o.x === nx && o.y === ny);
        const addGuide = (nx, ny) => { if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) amap.add(nx + ',' + ny); };
        if (p.type === '砲') {
            DIRS_4.forEach(([dx, dy]) => {
                let jump = false; let tx=p.x, ty=p.y; for (let i = 1; i < 10; i++) {
                    tx+=dx; ty+=dy; if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) break;
                    const target = check(tx, ty); if (!jump) { if (!target) addGuide(tx, ty); else jump = true; } else { if (target && target.side === 'blue') addGuide(tx, ty); if(target) break; }
                }
            });
        } else { getAttackMap(pieces, 'red', p).forEach(pos => amap.add(pos)); }
        amap.forEach(pos => {
            const [gx, gy] = pos.split(',').map(Number); const m = document.createElement('div'); m.className = 'marker guide';
            m.style.left = (5 + (gx / 7) * 90) + '%'; m.style.top = (5 + (gy / 8) * 90) + '%'; container.appendChild(m);
        });
    }

    function render() {
        container.querySelectorAll('.piece, .marker').forEach(el => el.remove());
        const amap = getAttackMap(pieces, 'red'), blue = pieces.find(p => p.side === 'blue');
        pieces.forEach(p => {
            if (p.id === draggedPieceId) return;
            const el = document.createElement('div'); el.className = 'piece piece-ui ' + p.side; el.dataset.id = p.id;
            if (p.side === 'blue') {
                if (isAwake) el.classList.add('awake-active'); else if (isTaiko) el.classList.add('taiko-active');
                if (!isAwake && !isTaiko && amap.has(p.x + ',' + p.y)) el.style.boxShadow = "0 0 15px #f00";
            }
            el.innerText = p.type; el.style.left = (5 + (p.x / 7) * 90) + '%'; el.style.top = (5 + (p.y / 8) * 90) + '%';
            el.onpointerdown = (e) => !isAnimating && handleStart(e, p.side, p.type, p.id); container.appendChild(el);
        });
        if (blue && !isAnimating) calculateMoves(blue);
    }

    function calculateMoves(car) {
        const PTS = { '卒': 8, '士': 8, '象': 15, '馬': 20, '将': 100, '砲': 20, '車': 30 };

        DIRS_4.forEach(([dx, dy]) => {
            let tx = car.x, ty = car.y;
            for (let i = 1; i < 10; i++) {
                tx += dx; ty += dy; if (tx < 0 || tx >= COLS || ty < 0 || ty >= ROWS) break;
                const target = pieces.find(p => p.x === tx && p.y === ty);
                if (!isTaiko && target?.side === 'blue') break;
                
                let sim = JSON.parse(JSON.stringify(pieces));
                let gainScore = 0;

                if (isTaiko) {
                    let sx = car.x, sy = car.y; while (sx !== tx || sy !== ty) {
                        sx += dx; sy += dy; const vIdx = sim.findIndex(p => p.x === sx && p.y === sy && p.side === 'red');
                        if (vIdx !== -1) { gainScore += PTS[sim[vIdx].type] || 0; sim.splice(vIdx, 1); }
                    }
                } else if (target?.side === 'red') { 
                    gainScore += PTS[target.type] || 0; 
                    sim = sim.filter(p => p.id !== target.id); 
                }

                if (isAwake) { 
                    const awakeTargets = sim.filter(p => p.side === 'red' && (p.x === tx || p.y === ty));
                    awakeTargets.forEach(p => { gainScore += PTS[p.type] || 0; });
                    sim = sim.filter(p => !(p.side === 'red' && (p.x === tx || p.y === ty))); 
                }

                sim = sim.map(p => p.side === 'blue' ? { ...p, x: tx, y: ty } : p);
                const safe = !getAttackMap(sim, 'red').has(tx + ',' + ty);
                let mType = safe ? (pieces.find(p=>p.x===tx&&p.y===ty&&p.side==='red') ? "best" : "safe") : "danger";
                
                if (safe && !pieces.find(p=>p.x===tx&&p.y===ty)) {
                    let aim = false; DIRS_4.forEach(([adx, ady]) => {
                        let ax = tx, ay = ty; for (let j = 1; j < 11; j++) {
                            ax += adx; ay += ady; if (ax < 0 || ax >= COLS || ay < 0 || ay >= ROWS) break;
                            const nt = sim.find(p => p.x === ax && p.y === ay);
                            if (nt?.side === 'red') {
                                let sim2 = sim.filter(p => p.id !== nt.id).map(p => p.side === 'blue' ? { ...p, x: ax, y: ay } : p);
                                if (!getAttackMap(sim2, 'red').has(ax + ',' + ay)) aim = true; break;
                            } else if (nt?.side === 'blue') break;
                        }
                    });
                    if (aim) mType = "aim";
                }

                const m = document.createElement('div'); m.className = 'marker ' + mType;
                m.style.left = (5 + (tx / 7) * 90) + '%'; m.style.top = (5 + (ty / 8) * 90) + '%';
                
                // ★追加：マーカーに座標とスコアの情報を記憶させる
                m.dataset.gx = tx;
                m.dataset.gy = ty;
                m.dataset.pts = gainScore;

                container.appendChild(m);
                if (!isTaiko && target) break;
            }
        });
    }


    init();
</script>
