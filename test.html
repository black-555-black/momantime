<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini AI Chat</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 20px auto; padding: 0 10px; line-height: 1.6; }
        #chat-container { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; background: #f9f9f9; border-radius: 5px; }
        .user-msg { color: blue; margin-bottom: 10px; }
        .ai-msg { color: green; margin-bottom: 10px; white-space: pre-wrap; }
        #input-area { display: flex; gap: 5px; }
        input { flex: 1; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; background: #4285f4; color: white; border: none; border-radius: 3px; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>

    <h1>Gemini AI 連携デモ</h1>
    
    <div id="chat-container">
        <div class="ai-msg">質問を入力して送信してください。</div>
    </div>

    <div id="input-area">
        <input type="text" id="userInput" placeholder="メッセージを入力...">
        <button id="sendBtn">送信</button>
    </div>

    <script type="module">
        // Google Generative AI SDKをインポート

        // 修正前
        // import { GoogleGenerativeAI } from "https://esm.run";

        // 修正後（リダイレクトを避けた直接のURLを指定）
        import { GoogleGenerativeAI } from "https://jsdelivr.net";

        // --- 設定 ---
        const API_KEY = "AIzaSyD08zaYqQ4QcX1CpizekiE6zgXEjQuqLGQ"; 
        const genAI = new GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
        // ------------

        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // メッセージを表示する関数
        function addMessage(text, isUser) {
            const div = document.createElement('div');
            div.className = isUser ? 'user-msg' : 'ai-msg';
            div.textContent = (isUser ? "あなた: " : "AI: ") + text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const prompt = userInput.value.trim();
            if (!prompt) return;

            addMessage(prompt, true);
            userInput.value = '';
            sendBtn.disabled = true;

            try {
                // AIにリクエストを送信
                const result = await model.generateContent(prompt);
                const response = await result.response;
                const text = response.text();
                
                addMessage(text, false);
            } catch (error) {
                addMessage("エラーが発生しました: " + error.message, false);
                console.error(error);
            } finally {
                sendBtn.disabled = false;
            }
        }

        // イベントリスナー
        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
